services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${PG_USER:-agentdemo}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-agentdemo}"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${PG_USER:-agentdemo}:${PG_PASSWORD}@postgres:5432/${PG_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      LISTEN_ADDR: ${LISTEN_ADDR:-0.0.0.0:50051}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:50051:50051"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    network_mode: host
    volumes:
      - ${CADDYFILE:?CADDYFILE must be set}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
