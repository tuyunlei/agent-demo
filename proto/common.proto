syntax = "proto3";

package ai.agent.platform.v1;

import "google/protobuf/timestamp.proto";

option go_package = "ai/agent/platform/v1;platformv1";

// 统一业务错误码（与 gRPC status code 配合使用）
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_UNAUTHENTICATED = 2;
  ERROR_CODE_PERMISSION_DENIED = 3;
  ERROR_CODE_NOT_FOUND = 4;
  ERROR_CODE_CONFLICT = 5;
  ERROR_CODE_RATE_LIMITED = 6;
  ERROR_CODE_QUOTA_EXCEEDED = 7;
  ERROR_CODE_PRECONDITION_FAILED = 8;
  ERROR_CODE_INTERNAL = 9;
  ERROR_CODE_UNAVAILABLE = 10;
  ERROR_CODE_TIMEOUT = 11;
  ERROR_CODE_TOOL_EXECUTION_FAILED = 12;
  ERROR_CODE_MODEL_EXECUTION_FAILED = 13;
}

message ErrorDetail {
  ErrorCode code = 1;
  string message = 2;
  string request_id = 3;
  map<string, string> metadata = 4;
}

message PaginationRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PaginationResponse {
  string next_page_token = 1;
  int64 total_size = 2;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

// 跨服务统一内容块。
message ContentBlock {
  oneof kind {
    TextBlock text = 1;
    ImageBlock image = 2;
    ToolCallBlock tool_call = 3;
    ToolResultBlock tool_result = 4;
  }
}

message TextBlock {
  string text = 1;
}

message ImageBlock {
  string uri = 1;
  string mime_type = 2;
  string alt = 3;
}

message ToolCallBlock {
  string tool_call_id = 1;
  string tool_name = 2;
  string arguments_json = 3;
}

message ToolResultBlock {
  string tool_call_id = 1;
  string result_json = 2;
  bool is_error = 3;
}

message Usage {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  int32 total_tokens = 3;
}

// SessionService 及 ChatService 复用实体。
message Session {
  string session_id = 1;
  string user_id = 2;
  string agent_id = 3;
  string title = 4;
  string summary = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  google.protobuf.Timestamp last_message_at = 8;
  bool archived = 9;
}

message ChatMessage {
  string message_id = 1;
  string session_id = 2;
  string role = 3;
  repeated ContentBlock blocks = 4;
  google.protobuf.Timestamp created_at = 5;
}
