[workspace]
members = [
  "crates/agent-domain",
  "crates/agent-context",
  "crates/agent-memory",
  "crates/agent-tools",
  "crates/agent-orchestrator",
  "crates/agent-proto",
  "crates/agent-storage",
  "crates/agent-llm",
  "crates/agent-channel",
  "crates/agent-server",
  "crates/agent-e2e",
]
resolver = "2"

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
# Safety: prevent silent data loss in numeric conversions
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"

# Correctness: no panicking in production code
unwrap_used = "deny"

# Complexity: keep functions small and simple
too_many_lines = "deny"
cognitive_complexity = "deny"

# API hygiene: callers should not silently ignore return values
must_use_candidate = "allow"  # TODO: L-05 will audit and enable
