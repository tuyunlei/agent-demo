[package]
name = "agent-server"
version = "0.1.0"
edition.workspace = true

[dependencies]
agent-proto = { path = "../agent-proto" }
agent-orchestrator = { path = "../agent-orchestrator" }
agent-channel = { path = "../agent-channel" }
agent-storage = { path = "../agent-storage" }
agent-llm = { path = "../agent-llm" }
agent-domain = { path = "../agent-domain" }
agent-tools = { path = "../agent-tools" }
agent-memory = { path = "../agent-memory" }
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate"] }

[lints]
workspace = true
