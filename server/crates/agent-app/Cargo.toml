[package]
name = "agent-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
agent-domain = { path = "../agent-domain" }
agent-types = { path = "../agent-types" }
async-trait = "0.1"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
