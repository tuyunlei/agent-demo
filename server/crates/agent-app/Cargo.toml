[package]
name = "agent-app"
version = "0.1.0"
edition.workspace = true

[dependencies]
agent-domain = { path = "../agent-domain" }
agent-types = { path = "../agent-types" }
async-trait = "0.1"
chrono = "0.4"
chrono-tz = "0.10"
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
