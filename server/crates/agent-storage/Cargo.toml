[package]
name = "agent-storage"
version = "0.1.0"
edition.workspace = true

[dependencies]
agent-domain = { path = "../agent-domain" }
agent-types = { path = "../agent-types" }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
bcrypt = "0.17"
