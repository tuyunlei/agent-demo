name: Server CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'server/**'
      - 'proto/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'server/**'
      - 'proto/**'
      - '.github/workflows/server-ci.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/test
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Architecture dependency check
        run: bash scripts/check-arch-deps.sh

      - name: File size and complexity check
        run: bash scripts/check-file-size.sh

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Coverage check
        run: |
          OUTPUT=$(cargo tarpaulin --workspace \
            --exclude-files '*/build.rs' '*/src/main.rs' '*_tests.rs' '*.pb.rs' \
            --skip-clean 2>&1)
          echo "$OUTPUT" | tail -5
          COVERAGE=$(echo "$OUTPUT" | grep -oP '[\d.]+% coverage' | grep -oP '[\d.]+')
          echo "Coverage: ${COVERAGE}%"
          THRESHOLD=54
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  acceptance-test:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: check-and-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentdemo
          POSTGRES_PASSWORD: REDACTED_PASSWORD
          POSTGRES_DB: agentdemo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.x'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('server/Cargo.lock') }}

      - name: Build server
        working-directory: server
        run: cargo build
        env:
          DATABASE_URL: postgres://agentdemo:REDACTED_PASSWORD@localhost:5432/agentdemo

      - name: Run migrations
        working-directory: server
        run: |
          cargo install sqlx-cli --no-default-features --features postgres || true
          sqlx migrate run --source crates/agent-storage/migrations
        env:
          DATABASE_URL: postgres://agentdemo:REDACTED_PASSWORD@localhost:5432/agentdemo

      - name: Start server
        working-directory: server
        run: |
          nohup cargo run > /tmp/server.log 2>&1 &
          sleep 10
          cat /tmp/server.log || true
        env:
          DATABASE_URL: postgres://agentdemo:REDACTED_PASSWORD@localhost:5432/agentdemo
          JWT_SECRET: ci-test-secret-key-for-acceptance
          ADMIN_EMAIL: admin@ci-test.local
          ADMIN_PASSWORD: ci-test-password
          LLM_BASE_URL: "http://localhost:9999"
          LLM_API_KEY: "fake-key"
          LLM_MODEL: "test-model"

      - name: Install grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz | tar xz
          sudo mv grpcurl /usr/local/bin/

      - name: Run acceptance tests
        run: bash server/scripts/acceptance-test.sh
        env:
          ACCEPTANCE_HOST: 127.0.0.1:50051
          SKIP_LLM_TESTS: "1"
