name: Mobile CI

on:
  push:
    branches: [develop, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [develop, main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Resolve Swift Package dependencies
        working-directory: mobile/AgentDemo
        run: swift package resolve

      - name: Build
        working-directory: mobile/AgentDemo
        run: |
          set -o pipefail
          xcodebuild build \
            -project AgentDemo.xcodeproj \
            -scheme AgentDemo \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../build-raw.log | xcbeautify

      - name: Unit Tests
        working-directory: mobile/AgentDemo
        run: |
          set -o pipefail
          xcodebuild test \
            -project AgentDemo.xcodeproj \
            -scheme AgentDemo \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
            -configuration Debug \
            -skip-testing:AgentDemoUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../../test-raw.log | xcbeautify

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-raw-logs
          path: |
            build-raw.log
            test-raw.log
          retention-days: 7
